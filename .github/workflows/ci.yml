name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip check
      - run: python -I -m obliryx --help
      - name: Test launcher (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\test_launcher.ps1
      - name: Test launcher (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tests\test_launcher.ps1

  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install '.[demo]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_multistep_demo.py -v

  desktop-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      # The runner supplies Node >=20.19 and Inno Setup 6. The build checks both.
      - shell: pwsh
        run: ./scripts/build-desktop.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: obliryx-windows-development
          path: |
            dist/windows-*/installer/*.exe
            dist/windows-*/inventory.json
            dist/windows-*/SHA256SUMS.txt
            dist/windows-*/licenses/
          if-no-files-found: error
